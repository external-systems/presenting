# Build the MkDocs site (with the slide deck at /slides/) using Nix and
# deploy it to GitHub Pages. Pull requests only check and build.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push cancels an older pending one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check (both builds + Nix lint)
        run: nix flake check -L
      - name: Build the site
        run: |
          nix build .#documentation -L
          # Copy out of the read-only Nix store for the Pages upload.
          cp -rL result _site
          chmod -R u+w _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
